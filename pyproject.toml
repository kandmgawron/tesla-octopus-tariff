[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octopus-tariff-compare"
version = "1.0.0"
description = "Find the cheapest Octopus Energy tariff for your home battery and solar setup"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
tesla = ["teslapy>=2.9.0", "pypowerwall>=0.8.0"]

[project.scripts]
octopus-tariff-compare = "octopus_powerwall_tariff_compare:main"

[project.urls]
Homepage = "https://github.com/kandmgawron/tesla-octopus-tariff"
Web = "https://octopus-tariff-compare-web.vercel.app"

[tool.setuptools]
py-modules = ["octopus_powerwall_tariff_compare"]
